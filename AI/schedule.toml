# 수집 스케줄 선언 (S15P21E102-107)
#
# 실행은 이 파일이 하지 않습니다. cron / Windows Task Scheduler 가 아래 시각에
# `python -m job.collector --run <name>` 을 부릅니다. 등록할 줄은 이 파일에서
# 생성하십시오 — 시각의 출처를 하나로 두기 위한 것입니다.
#
#     PYTHONPATH=AI python -m job.collector --render cron
#     PYTHONPATH=AI python -m job.collector --render schtasks
#
# 결번 판정 간격. 하루 2회는 12시간이고, 14시간은 늦게 시작한 회차가 끝날
# 여유입니다. 더 늘리면 한 주기를 통째로 놓쳐도 알림이 가지 않습니다.
max_interval_hours = 14

# 실행 이력 (JSONL, append 전용). 이 파일 기준 상대 경로입니다.
#
# 회차는 이 파일이 있는 디렉터리(AI/)를 작업 디렉터리로 실행됩니다. 그래서
# args 의 경로도 여기 기준입니다 — 저장소 루트의 data/ 로 보내려면 ../ 입니다.
history_path = "../data/collection-history.jsonl"

# 알림 웹훅 URL을 담은 환경변수 이름. URL 자체는 비밀값이라 이 파일에 적지
# 않습니다 (S15P21E102-106 완료 조건: 저장소 히스토리에 비밀값 0건).
webhook_env = "GITJOB_ALERT_WEBHOOK_URL"

# --- 워크넷 ------------------------------------------------------------------
#
# --days-back 1 은 하루 경계의 결번을 막습니다. 어제 늦게 등록된 공고는
# 어제 날짜를 달고 있어서, 오전 회차가 오늘만 보면 영원히 놓칩니다.
#
# --occupation-preset dev 가 없으면 요양보호사·가구제조 공고가 채워집니다.
# Worknet_Collector_V1/occupations.py 참고.

[[run]]
name = "worknet-morning"
site = "WORKNET"
module = "Worknet_Collector_V1"
at = ["09:10"]
args = [
  "--occupation-preset", "dev",
  "--days-back", "1",
  "--max-pages", "20",
  "--cursor", "../data/worknet/cursor.json",
  "--output-dir", "../data/worknet",
]

[[run]]
name = "worknet-evening"
site = "WORKNET"
module = "Worknet_Collector_V1"
at = ["21:10"]
args = [
  "--occupation-preset", "dev",
  "--days-back", "1",
  "--max-pages", "20",
  "--cursor", "../data/worknet/cursor.json",
  "--output-dir", "../data/worknet",
]

# --- 사람인 ------------------------------------------------------------------
#
# 워크넷보다 20분 늦게 시작합니다. 두 수집이 겹치면 같은 시각에 두 사이트로
# 요청이 나가고, 사람인 쪽 간격(2초)을 늘려도 우리 쪽 부하가 겹칩니다.
#
# --category-preset dev 가 없으면 카지노·호텔 공채와 생산직이 채워집니다.
# Saramin_Collector_V1/categories.py 참고 — 기술스택 코드는 쓰지 않습니다.

[[run]]
name = "saramin-morning"
site = "SARAMIN"
module = "Saramin_Collector_V1"
at = ["09:30"]
args = [
  "--category-preset", "dev",
  "--days-back", "1",
  "--max-pages", "20",
  "--cursor", "../data/saramin/cursor.json",
  "--output-dir", "../data/saramin",
]

[[run]]
name = "saramin-evening"
site = "SARAMIN"
module = "Saramin_Collector_V1"
at = ["21:30"]
args = [
  "--category-preset", "dev",
  "--days-back", "1",
  "--max-pages", "20",
  "--cursor", "../data/saramin/cursor.json",
  "--output-dir", "../data/saramin",
]

# --- 게임잡 -----------------------------------------------------------------
#
# ## 기준 A 미통과입니다. 소유자 판단으로 켰습니다 (2026-09-10, `-196`).
#
# 게임잡은 `-149` 기준 A 심사에서 **미통과**입니다
# (docs/data/2026-09-08-source-criterion-a-review.md §3). 운영사 웍스피어가
# 잡코리아와 동일 법인(사업자등록번호 110-81-34859)이라 `-94`의 판례·소송
# 근거가 그대로 적용되고, 그 문서는 채용공고 source를 워크넷·사람인 2종으로
# 확정했습니다.
#
# 원래 켜는 전제는 웍스피어와의 데이터 제공 계약이었습니다.
#
# **2026-09-10 에 소유자가 계약 없이 진행하기로 결정했습니다 (`-196`).**
# 동일 법인 근거는 그대로 유효하고 없어지지 않았습니다. 게임잡 자체는
# robots.txt 가 요청 경로를 허용하고 자체 약관에서 걸린 조항도 없어서, 이
# 사이트의 탈락 근거는 운영사가 판례 당사자와 같은 법인이라는 것 하나입니다.
# 그 추론이 옳다면 계약 없는 수집의 위험도 잡코리아와 같은 성질입니다.
#
# 회차 manifest 의 `source_admission` 블록이 `criterion_a: FAIL` 과
# `admitted_by` 를 함께 기록합니다. 되돌리려면 `enabled` 를 false 로 두면
# 됩니다.
#
# 사람인보다 20분 늦게 시작합니다. 세 수집이 같은 시각에 겹치면 사이트별
# 간격(2초)을 지켜도 우리 쪽 부하가 겹칩니다.
#
# --duty-preset dev 가 없으면 게임기획·원화·애니메이션·마케팅 공고가
# 채워집니다. 게임잡은 서버측 직무 필터를 query string 으로 받지 않아서 이
# 필터는 우리 쪽에서 동작합니다 — GameJob_Collector_V1/duties.py 참고.
#
# --max-pages 가 2 인 이유. 게임잡 목록은 Page 파라미터를 무시합니다 —
# 2026-09-08 실측으로 80페이지가 3,200행을 돌려줬고 고유 공고는 40건이었습니다.
# 모든 페이지가 같은 페이지입니다. 그래서 페이지를 늘려도 데이터가 아니라
# 요청만 늘어나고, 수집기는 새 공고가 없는 페이지에서 중단합니다.
#
# 1 이 아니라 2 로 둔 것은 진단을 남기기 위해서입니다. 2페이지째가 중복임을
# 확인해 manifest 의 paging_advances 를 false 로 기록하므로, 사이트가 나중에
# 페이징을 고치면 그 값이 true 로 바뀌어 드러납니다. 1 이면 확인 자체가
# 불가능합니다.
#
# 공고 하나가 본문 iframe 때문에 최대 3요청인 점은 그대로입니다.

[[run]]
name = "gamejob-morning"
site = "GAMEJOB"
module = "GameJob_Collector_V1"
enabled = true
at = ["09:50"]
args = [
  "--duty-preset", "dev",
  "--days-back", "1",
  "--max-pages", "2",
  "--cursor", "../data/gamejob/cursor.json",
  "--output-dir", "../data/gamejob",
]

[[run]]
name = "gamejob-evening"
site = "GAMEJOB"
module = "GameJob_Collector_V1"
enabled = true
at = ["21:50"]
args = [
  "--duty-preset", "dev",
  "--days-back", "1",
  "--max-pages", "2",
  "--cursor", "../data/gamejob/cursor.json",
  "--output-dir", "../data/gamejob",
]

# --- 커리어 -----------------------------------------------------------------
#
# ## 기준 A 미통과입니다. 소유자 판단으로 켰습니다 (2026-09-10, `-196`).
#
# 커리어는 기준 A **미통과**입니다. 다만 게임잡과 탈락 근거가 다릅니다.
#
#   운영사      (주)커리어넷 220-86-73547 — 잡코리아/웍스피어(110-81-34859)와
#               별개 법인이라 `-94` 의 판례 근거는 적용되지 않습니다.
#   robots.txt  job.career.co.kr 은 공고 경로를 **허용**합니다. 막힌 것은
#               /admin /app /base /biz /user /signup 뿐이고 sitemap.xml 도
#               공개합니다. 이 수집기가 요청하는 경로는 하나도 막혀 있지 않습니다.
#   약관        제14조 5항 — "이용자는 커리어서비스 이용을 통해 획득한 정보 및
#               게시물을 커리어넷의 동의없이 복제, 배포할 수 없으며 상업적,
#               영리목적으로 이용할 수 없습니다." 제20조 6·7항 동일 취지.
#
# 기준 A 가 OR 조건이므로 robots.txt 허용만으로는 통과가 아닙니다. HDFS 에
# 적재하는 것은 복제에 해당합니다. 크롤링·스크래핑을 명시적으로 금지하는
# 조항은 없어서 링커리어(제20조 명시 금지)보다는 약하지만, 금지는 금지입니다.
#
# **이 수집기는 위 조항을 확인한 뒤 소유자가 진행을 결정해 만들어졌습니다.**
# 그 결정은 일회성 수집(2026-09-09, 1,139건)에 대한 것이었고, 하루 2회 자동
# 회차는 별개 판단이라 여기서 막아 뒀습니다.
#
# **2026-09-10 에 소유자가 그 별개 판단도 진행으로 결정했습니다 (`-196`).**
# 위 약관 조항은 그대로 유효하고 없어지지 않았습니다 — 켠 것은 근거가
# 바뀌었기 때문이 아니라 소유자가 위험을 감수하기로 했기 때문입니다. 회차
# manifest 의 `source_admission` 블록이 `criterion_a: FAIL` 과 `admitted_by`
# 를 함께 기록하므로, 나중에 이 결정을 되짚을 근거는 남습니다.
#
# 되돌리려면 `enabled` 를 false 로 두면 됩니다.
#
# --category-preset dev 가 없으면 경영·마케팅·디자인 공고가 채워집니다.
# H0(IT.인터넷)과 N0(연구개발.엔지니어) 두 대분류가 필요합니다 — 임베디드와
# R&D 직무가 N0 에 있어서 H0 만으로는 놓칩니다.
#
# --max-pages 40 은 여유값입니다. 2026-09-09 실측으로 H0 는 8페이지에서
# 끝나고(227건) N0 는 12페이지에서도 계속됐습니다. 실제 중단 조건은 행이 없는
# 페이지이고, 광고 슬롯은 파서가 제외합니다 — Career_Collector_V1/parser.py 참고.
#
# 게임잡보다 20분 늦게 시작합니다. 네 수집이 같은 시각에 겹치면 사이트별
# 간격(2초)을 지켜도 우리 쪽 부하가 겹칩니다.

[[run]]
name = "career-morning"
site = "CAREER"
module = "Career_Collector_V1"
enabled = true
at = ["10:10"]
args = [
  "--category-preset", "dev",
  "--days-back", "1",
  "--max-pages", "40",
  "--cursor", "../data/career/cursor.json",
  "--output-dir", "../data/career",
]

[[run]]
name = "career-evening"
site = "CAREER"
module = "Career_Collector_V1"
enabled = true
at = ["22:10"]
args = [
  "--category-preset", "dev",
  "--days-back", "1",
  "--max-pages", "40",
  "--cursor", "../data/career/cursor.json",
  "--output-dir", "../data/career",
]

# --- 잡코리아 ---------------------------------------------------------------
#
# ## 기준 A 미통과입니다. 세 사이트 중 근거가 가장 강한 쪽입니다.
#
# `-94` §1 이 제외를 결론하고 §7-2 가 코드 폐기를 지시했습니다. 근거는 §3.1 —
# 서울고등법원이 잡코리아 공고 무단 크롤링을 데이터베이스제작자 권리 침해로
# 판단했습니다(4.5억 인정, 120억 합의). 공식 API 는 신입공채·공공기관/학교로
# 범위가 제한되어 직무별 기술 수요 집계에 쓸 수 없습니다(§3.2).
#
# 커리어는 약관 조항, 게임잡은 동일 법인 추론입니다. **여기만 이 사이트
# 운영자를 상대로, 바로 이 행위에 대해 실제로 내려진 판결입니다.**
#
# **2026-09-10 에 소유자가 수집하기로 결정했습니다 (`-196`).** 판례 근거는
# 그대로 유효하고 없어지지 않았습니다. 켠 것은 근거가 바뀌었기 때문이 아니라
# 소유자가 위험을 감수하기로 했기 때문이며, 회차 manifest 의
# `source_admission` 블록이 `criterion_a: FAIL` 과 판례·결정자를 함께
# 기록합니다. 되돌리려면 `enabled` 를 false 로 두면 됩니다.
#
# 이 수집기는 원래 8월 1회 백필용이라 스케줄에 올릴 수 없었습니다. `-196` 에서
# 세 가지를 맞췄습니다.
#
#   --days-back / --cursor  없었습니다. 날짜 범위가 고정(8월)이어서 회차마다
#                           같은 구간을 다시 긁었을 것입니다. 다른 넷과 같은
#                           방식으로 붙였습니다.
#   기본 날짜               8월 고정 → 오늘. 회차는 "오늘 등록된 공고" 입니다.
#   요청 간격               0.8/0.5초 → 2.0/2.0초. 다른 사이트와 같습니다.
#                           가장 노출이 큰 사이트가 가장 빠른 요청자였습니다.
#
# 커리어보다 20분 늦게 시작합니다. 다섯 수집이 같은 시각에 겹치면 사이트별
# 간격을 지켜도 우리 쪽 부하가 겹칩니다.
#
# --duty-code 1000229 은 백엔드개발자입니다. 다른 사이트의 --*-preset 에
# 해당하는 자리이고, 기본값이 같더라도 명시합니다 — 필터 없는 회차는 개발자가
# 아닌 공고를 채웁니다. 기본값에 의존하면 그 기본값이 바뀔 때 조용히 달라집니다.
#
# 로그인·CAPTCHA 우회·접근제어 우회는 하지 않습니다. 공개 목록과 공개 상세
# iframe 만 읽습니다.
#
# --no-ocr 를 두지 않았습니다. 이 수집기의 OCR 이 프로젝트에서 유일한 이미지
# 본문 처리이고, `job.collector.technology` 가 `[OCR 이미지]` 마커를 읽어
# `OCR_RULE_BASED_V1` 로 기록합니다.

[[run]]
name = "jobkorea-morning"
site = "JOBKOREA"
module = "JobKorea_Collector_V1"
enabled = true
at = ["10:30"]
args = [
  "--duty-code", "1000229",
  "--days-back", "1",
  "--max-pages", "40",
  "--cursor", "../data/jobkorea/cursor.json",
  "--output-dir", "../data/jobkorea",
]

[[run]]
name = "jobkorea-evening"
site = "JOBKOREA"
module = "JobKorea_Collector_V1"
enabled = true
at = ["22:30"]
args = [
  "--duty-code", "1000229",
  "--days-back", "1",
  "--max-pages", "40",
  "--cursor", "../data/jobkorea/cursor.json",
  "--output-dir", "../data/jobkorea",
]
