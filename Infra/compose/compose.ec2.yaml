# EC2 production entrypoint for the P1 core services.
#
# compose.yaml does not publish database/cache/Kafka ports. Keeping this
# explicit file in the command makes the intended EC2 boundary obvious and
# leaves room for the future nginx-only 80/443 exposure.

services:
  # These dependencies are for the single-host fallback where core is also
  # started on this machine. The HA overlay intentionally leaves them out and
  # points app containers at shared external state instead.
  backend:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy

  collector:
    depends_on:
      kafka:
        condition: service_healthy

  worker:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
      hdfs-namenode:
        condition: service_healthy
      spark-master:
        condition: service_healthy

  nginx:
    ports:
      - "${NGINX_EC2_BIND:-0.0.0.0}:${NGINX_EC2_HTTP_PORT:-80}:80"

  postgres:
    restart: unless-stopped

  redis:
    restart: unless-stopped

  kafka:
    restart: unless-stopped
