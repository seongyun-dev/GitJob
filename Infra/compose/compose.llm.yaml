# Local GPU LLM runtime for the notebook.
#
# This file is intentionally independent from the main GitJob Compose project.
# It keeps the model cache, network, lifecycle, and GPU allocation separate
# from PostgreSQL, Redis, Kafka, HDFS, and Spark.

services:
  ollama:
    # Verified on this notebook as Ollama 0.33.2. Override OLLAMA_IMAGE only
    # when intentionally upgrading the runtime.
    image: ${OLLAMA_IMAGE:-ollama/ollama@sha256:020e4134285e2ef4d8fd801234176de3b4faadc992a3eb06c8e66a2f9d4c4ba2}
    restart: unless-stopped
    gpus: all
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:--1}
    ports:
      - "127.0.0.1:${LLM_HOST_PORT:-11434}:11434"
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 20s

volumes:
  ollama-models:
    name: ${LLM_VOLUME_NAME:-gitjob-ollama-models}
    external: true
