user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile on;
    keepalive_timeout 65;

    # Docker's embedded DNS. Without this, proxy_pass cannot take a variable, and
    # without a variable nginx resolves an upstream host exactly once at startup and
    # caches that address forever. A container recreated with a new IP then leaves
    # nginx connecting to an address nothing is listening on, which is what took the
    # service down for two hours on 2026-09-09. valid= bounds how long a stale
    # address can survive.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Preserve the original client protocol when an AWS ALB terminates TLS
    # before forwarding HTTP to this Nginx container.
    map $http_x_forwarded_proto $forwarded_proto {
        default $scheme;
        http http;
        https https;
    }

    include /etc/nginx/conf.d/*.conf;
}
