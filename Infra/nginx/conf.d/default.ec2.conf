# Deliberately not an upstream block. An upstream resolves its server names once
# when nginx starts and never again, so recreating a container behind it silently
# breaks routing until nginx is restarted. Passing the address through a variable
# makes nginx re-resolve it via the resolver in nginx.conf.
#
# proxy_pass with a variable also changes URI handling: when the variable carries no
# URI, the original request URI is forwarded unchanged, which is what the previous
# `proxy_pass http://gitjob_backend;` did. Where a URI is needed it is written into
# the variable itself.

# Production service domain. The SSAFY-provided hostname remains available for
# SSH, but browser traffic uses gitjob.shop as the canonical origin.

# Keep the ACME challenge and health endpoints available over HTTP. All other
# browser/API traffic is redirected to the TLS endpoint below.
server {
    listen 80;
    server_name gitjob.shop;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /health {
        set $backend_health http://backend:8080/actuator/health;
        proxy_pass $backend_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://gitjob.shop$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name gitjob.shop;

    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/gitjob.shop/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gitjob.shop/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    location = /health {
        set $backend_health http://backend:8080/actuator/health;
        proxy_pass $backend_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
