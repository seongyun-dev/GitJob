upstream gitjob_backend {
    server backend:8080;
}

upstream gitjob_frontend {
    server frontend:80;
}

# Current SSAFY-provided hostname. When the production domain is purchased,
# update both server_name/certificate paths and the application callback/CORS
# values together.

# Keep the ACME challenge and health endpoints available over HTTP. All other
# browser/API traffic is redirected to the TLS endpoint below.
server {
    listen 80;
    server_name j15e102.p.ssafy.io _;

    client_max_body_size 10m;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location = /health {
        proxy_pass http://gitjob_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto http;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://j15e102.p.ssafy.io$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name j15e102.p.ssafy.io _;

    client_max_body_size 10m;

    ssl_certificate /etc/letsencrypt/live/j15e102.p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/j15e102.p.ssafy.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_prefer_server_ciphers off;

    location = /health {
        proxy_pass http://gitjob_backend/actuator/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        proxy_pass http://gitjob_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        proxy_pass http://gitjob_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws/ {
        proxy_pass http://gitjob_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://gitjob_frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }
}
