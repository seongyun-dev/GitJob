# Deliberately not an upstream block. An upstream resolves its server names once
# when nginx starts and never again, so recreating a container behind it silently
# breaks routing until nginx is restarted. Passing the address through a variable
# makes nginx re-resolve it via the resolver in nginx.conf.
#
# proxy_pass with a variable also changes URI handling: when the variable carries no
# URI, the original request URI is forwarded unchanged, which is what the previous
# `proxy_pass http://gitjob_backend;` did. Where a URI is needed it is written into
# the variable itself.

server {
    listen 80;
    server_name _;

    client_max_body_size 10m;

    # The load balancer uses this readiness endpoint. A static Nginx 200 would
    # keep a node in rotation even when its backend is unavailable.
    location = /health {
        set $backend_health http://backend:8080/actuator/health;
        proxy_pass $backend_health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
    }

    # Liveness for diagnosing the edge container itself. This is not the ALB
    # target-group check because it intentionally does not depend on Backend.
    location = /nginx-health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /ws/ {
        set $backend http://backend:8080;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        set $frontend http://frontend:80;
        proxy_pass $frontend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host $host;
    }
}
