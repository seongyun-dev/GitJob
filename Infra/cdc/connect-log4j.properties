# Kafka Connect worker logging, bounded (S15P21E102-258).
#
# The Debezium image ships this file at /kafka/config/log4j.properties and its
# entrypoint runs `cp -rn config.orig/* config`, so a read-only bind mount over
# that path survives startup untouched. Mounting the file is not a stylistic
# choice: the entrypoint's CONNECT_LOG4J_* environment path lowercases every
# property name (`prop_name=... | tr '[:upper:]' '[:lower:]'`), and log4j 1.x
# matches `MaxFileSize` by its bean property name, so `maxfilesize` would be
# accepted into the file and then silently ignored. Setting the bound through
# an env var would look configured and cap nothing.
#
# ## Why the appender class changed
#
# The image shipped `DailyRollingFileAppender`, which rotates on the hour and
# has neither `MaxFileSize` nor `MaxBackupIndex` — log4j 1.x gives it no way to
# bound size or file count, and it never deletes. On 2026-09-14 a Rebootstrap
# loop wrote 4.54 GiB into /kafka/logs, the service host root hit 100%, and
# Postgres PANICked. The docker json-file cap (max-size 10m, max-file 3) never
# applied here: that bounds the container's stdout capture, not this appender's
# own files.
#
# `RollingFileAppender` is the only appender in this log4j that can bound both.
# It costs the hourly file boundary, which was never what kept the disk safe.
#
# ## Why 10 MB x 10
#
# Measured on the operational worker 2026-09-17: 21 consecutive hourly files
# (2026-09-16-06 .. 2026-09-17-01) of 132,985-133,869 bytes each, i.e. ~133 KB
# per hour or ~3.2 MB per day at rest.
#
#   MaxFileSize=10MB     same number as the compose json-file cap, so the two
#                        log bounds on this container are one value to reason
#                        about instead of two.
#   MaxBackupIndex=9     1 active + 9 backups = 100 MB hard ceiling.
#
# 100 MB is ~31 days of history at the measured rate, so normal operation keeps
# more than the hourly scheme did. Under a repeat of the incident it caps the
# same flood at 100 MB — 46x smaller than the 4.54 GiB it actually wrote, and
# 0.1% of the root free space the host had on 2026-09-17 (90 GB). The most
# recent 100 MB of a flood is still far more than is needed to identify it.
#
# Everything else is the image's file verbatim; changing levels or layout here
# would be a different decision.

kafka.logs.dir=logs

log4j.rootLogger=INFO, stdout, appender

# Disable excessive reflection warnings - KAFKA-5229
log4j.logger.org.reflections=ERROR

log4j.appender.stdout=org.apache.log4j.ConsoleAppender
log4j.appender.stdout.threshold=INFO
log4j.appender.stdout.layout=org.apache.log4j.PatternLayout
log4j.appender.stdout.layout.ConversionPattern=%d{ISO8601} %-5p  %X{dbz.connectorType}|%X{dbz.connectorName}|%X{dbz.connectorContext}  %m   [%c]%n


log4j.appender.appender=org.apache.log4j.RollingFileAppender
log4j.appender.appender.File=${kafka.logs.dir}/connect-service.log
log4j.appender.appender.MaxFileSize=10MB
log4j.appender.appender.MaxBackupIndex=9
log4j.appender.appender.layout=org.apache.log4j.PatternLayout
log4j.appender.appender.layout.ConversionPattern=%d{ISO8601} %-5p  %X{dbz.connectorType}|%X{dbz.connectorName}|%X{dbz.connectorContext}  %m   [%c]%n
