spring:
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  application:
    name: gitjob

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB:gitjob}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  # db/init.sql was applied by hand, which is why environments drifted: the
  # production database was still empty while the entities expected the analysis
  # tables. Flyway owns the schema now and runs before Hibernate validates it.
  # db/cdc and db/c-compute are outside this location on purpose; see those
  # directories for why they are still applied separately.
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Every environment starts from V1, so there is no legacy database to adopt.
    # Left off deliberately: it would silently mark an unknown schema as current.
    baseline-on-migrate: false

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    # show-sql은 logback을 거치지 않고 stdout에 직접 출력하므로 JSON 로그 사이에
    # 파싱 불가능한 줄을 섞는다(1582). SQL이 필요하면 show-sql 대신
    # LOG_LEVEL_SQL=debug로 logger를 통해 남긴다.
    show-sql: ${JPA_SHOW_SQL:false}

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: ${REDIS_DATABASE:0}
      connect-timeout: ${REDIS_CONNECT_TIMEOUT:2s}
      timeout: ${REDIS_TIMEOUT:2s}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}
    consumer:
      # Offsets are committed after the listener returns, so a crash mid-apply
      # replays instead of losing the result. AnalysisResultService is idempotent.
      enable-auto-commit: false
      auto-offset-reset: earliest
    producer:
      acks: all
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        "[enable.idempotence]": true
        "[spring.json.add.type.headers]": false
        "[max.block.ms]": 5000
        "[delivery.timeout.ms]": 10000
        "[request.timeout.ms]": 5000

gitjob:
  analysis:
    request:
      # 판정 기준 Registry 버전은 여기 없다. technology_registry의 CURRENT 행을
      # 읽는다(CurrentRegistryVersion). 설정으로 두면 실재하지 않는 버전이 기본값으로
      # 앉을 수 있고, 그 값으로 규칙을 조회하면 조용히 0행이 나온다.
      poll-after-seconds: ${ANALYSIS_POLL_AFTER_SECONDS:2}
      # 진행 중 분석이 새 요청을 막는 기간이자, 그것을 넘긴 분석을 StaleAnalysisReaper가
      # FAILED(ANALYSIS_TIMED_OUT)로 종료시키는 기준이다. 두 곳이 같은 값을 써야 한다 --
      # 차단만 풀고 잡을 살려 두면 그 저장소가 uq_analysis_job_active에 묶여 영구히
      # 분석 불가가 된다.
      #
      # 기본 2시간은 워커가 한 잡을 붙들 수 있는 최대 시간에서 나왔다
      # (Infra/compose/compose.yaml의 analysis-worker):
      #   ANALYSIS_CLONE_TIMEOUT_SECONDS=600   클론 10분
      #   ANALYSIS_CLAIM_LEASE_SECONDS=900     lease 15분
      #   ANALYSIS_MAX_POLL_INTERVAL_MS=900000 15분
      #   ANALYSIS_MAX_ATTEMPTS=5
      # 최악 5 x 15분 = 75분. 2시간은 그 위의 여유다.
      # 워커 쪽 값을 올리면 이 값도 함께 올려야 한다.
      active-window: ${ANALYSIS_ACTIVE_WINDOW:2h}
      # 끝난 배치를 화면에 계속 보여 주는 기간. 새로고침해도 "4/4 완료"와 새 요청
      # 버튼이 남아 있되, 며칠 뒤 들어왔을 때 옛 배치가 되살아나지 않게 한다.
      completed-batch-visible-for: ${ANALYSIS_COMPLETED_BATCH_VISIBLE_FOR:30m}
      # 한 요청에 담을 수 있는 저장소 수. 항목마다 GitHub 왕복이 2번이고 한 요청 안에서
      # 동기로 일어나므로, 상한이 없으면 한 번의 제출이 rate limit을 통째로 쓴다.
      max-batch-size: ${ANALYSIS_MAX_BATCH_SIZE:10}
    reaper:
      poll-interval: ${ANALYSIS_REAPER_POLL_INTERVAL:1m}
      initial-delay: ${ANALYSIS_REAPER_INITIAL_DELAY:30s}
    credential-broker:
      enabled: ${ANALYSIS_PRIVATE_REPOSITORIES_ENABLED:false}
      service-token: ${ANALYSIS_WORKER_SERVICE_TOKEN:}
    outbox:
      # CDC uses Debezium, not a Spring Kafka producer. POLLING is a deliberate rollback option.
      mode: ${ANALYSIS_OUTBOX_MODE:CDC}
      # Legacy polling switch only; true must never enable polling in CDC mode.
      enabled: ${ANALYSIS_OUTBOX_ENABLED:true}
      poll-interval: ${ANALYSIS_OUTBOX_POLL_INTERVAL:2s}
      initial-delay: 10s
      batch-size: ${ANALYSIS_OUTBOX_BATCH_SIZE:20}
      max-attempts: ${ANALYSIS_OUTBOX_MAX_ATTEMPTS:10}
      send-timeout: ${ANALYSIS_OUTBOX_SEND_TIMEOUT:10s}
      retry-delay: ${ANALYSIS_OUTBOX_RETRY_DELAY:5s}
      max-retry-delay: ${ANALYSIS_OUTBOX_MAX_RETRY_DELAY:5m}
  llm:
    summary:
      # 노트북 GPU 위의 요약 서비스. 비워 두면 아예 부르지 않는다 -- 기본이
      # 꺼짐이어야 서비스를 띄우지 않은 환경에서 화면이 매번 timeout 을
      # 기다리지 않는다.
      base-url: ${LLM_SUMMARY_BASE_URL:}
      # cold start 가 1분에 가깝다. 연결 자체는 5초 안에 갈린다.
      timeout: ${LLM_SUMMARY_TIMEOUT:120s}
  kafka:
    topics:
      repository-analysis:
        requests: ${KAFKA_TOPIC_REPOSITORY_ANALYSIS_REQUESTS:gitjob.repository-analysis.requests.v1}
        results: ${KAFKA_TOPIC_REPOSITORY_ANALYSIS_RESULTS:gitjob.repository-analysis.results.v1}
        # v3 결과 토픽. 워커는 Registry 버전에 따라 발행 토픽을 바꾸며 v1 을 함께
        # 보내지 않는다(AI/analysis/consumer.py). registry-20260911.3/.4 환경에서
        # 이 값을 비워 두면 결과가 도달하지 않아 분석이 QUEUED 에 남는다.
        # 워커와 같은 환경 변수 이름을 쓴다.
        results-v3: ${KAFKA_TOPIC_REPOSITORY_ANALYSIS_RESULTS_V3:}
        # 적용하지 못한 결과가 가는 곳. 역직렬화에 실패한 결과는 재시도로 고쳐지지
        # 않아 곧바로 여기로 간다 -- 전에는 로그 한 줄만 남기고 커밋돼 분석이 QUEUED 에
        # 남은 채 무엇을 재생해야 하는지조차 알 수 없었다.
        #
        # 워커의 KAFKA_TOPIC_REPOSITORY_ANALYSIS_DLQ 와는 다른 토픽이다. 그쪽은 처리하지
        # 못한 요청이 가는 곳이고 payload 모양이 다르다.
        results-dlq: ${KAFKA_TOPIC_REPOSITORY_ANALYSIS_RESULTS_DLQ:gitjob.repository-analysis.results.dlq.v1}
        # 워커가 단계 전환을 알리는 토픽. 선택값이라 비워 두면 구독하지 않고,
        # 분석은 예전처럼 QUEUED 에서 종료로 한 번에 움직인다. 이 값을 채우는 것이
        # 곧 진행 표시를 켜는 일이므로 BE 를 먼저 배포해도 동작이 바뀌지 않는다.
        #
        # 결과 토픽과 달리 DLQ 가 없다. 잃으면 화면이 한 단계 늦을 뿐이고, 표시용
        # 메시지 하나가 파티션을 세우는 편이 훨씬 비싸다.
        progress: ${KAFKA_TOPIC_REPOSITORY_ANALYSIS_PROGRESS:}
    consumer:
      repository-analysis-results:
        group-id: ${ANALYSIS_RESULTS_CONSUMER_GROUP:gitjob-analysis-results}
      repository-analysis-progress:
        group-id: ${ANALYSIS_PROGRESS_CONSUMER_GROUP:gitjob-analysis-progress}
  compute:
    # C Compute(데이터 서버 Worker 8080)의 내부 주소와 토큰. 둘 다 서버 설정으로만
    # 주입하고 브라우저에 전달하지 않는다. 기본값을 넣지 않는 이유는 관리자망
    # (Tailscale) 주소이고, 코드에 박힌 사설 IP는 환경이 바뀌면 조용히 틀린 곳을
    # 가리키기 때문이다. 비어 있으면 C를 호출하지 않고 계산 결과를 미준비로 내린다.
    base-url: ${C_COMPUTE_URL:}
    token: ${C_COMPUTE_TOKEN:}
    # 조회는 사용자 요청 스레드가 물려 있으므로 짧게 둔다.
    read-timeout: ${C_COMPUTE_READ_TIMEOUT:5s}
    # 분석 완료 전달은 C가 실제로 계산하는 동안 응답을 기다린다.
    write-timeout: ${C_COMPUTE_WRITE_TIMEOUT:30s}
  monitoring:
    prometheus:
      # 비워 두면 Prometheus를 호출하지 않고 화면에 미연결 상태를 내린다. 관리자망
      # 주소이므로 기본값을 넣지 않는다 — 코드에 박힌 사설 IP는 환경이 바뀌면 조용히
      # 틀린 곳을 가리킨다.
      base-url: ${PROMETHEUS_BASE_URL:}
      # 관리자망이 끊겼을 때 화면이 무한정 기다리지 않게 한다.
      timeout: ${PROMETHEUS_TIMEOUT:3s}
      # Infra/monitoring/prometheus/prometheus.yml의 global.scrape_interval과 같아야 한다.
      scrape-interval: ${PROMETHEUS_SCRAPE_INTERVAL:15s}
      # target 라벨의 cluster 값. Infra/monitoring/prometheus/targets/node-exporter.yml이 정한다.
      cluster: ${PROMETHEUS_CLUSTER:gitjob}
    links:
      # 화면 Quick Access가 여는 주소. FE 번들에 넣지 않고 응답으로 전달한다.
      # 미설정이면 응답에서 null이 되어 화면은 링크를 그리지 않는다.
      grafana-url: ${GRAFANA_ADMIN_URL:}
      prometheus-url: ${PROMETHEUS_ADMIN_URL:}

jwt:
  secret: ${JWT_SECRET:gitjob-local-jwt-secret-key-change-me}
  issuer: ${JWT_ISSUER:gitjob}
  access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:30m}
  refresh-token-expiration: ${JWT_REFRESH_TOKEN_EXPIRATION:14d}

encryption:
  symmetric-key: ${AES_SYMMETRIC_KEY}
  salt: ${AES_SALT}

github:
  oauth:
    client-id: ${GITHUB_CLIENT_ID:}
    client-secret: ${GITHUB_CLIENT_SECRET:}
    redirect-uri: ${GITHUB_REDIRECT_URI:http://localhost:8080/api/v1/auth/github/callback}
    api-url: ${GITHUB_API_URL:https://api.github.com}
    # 콜백 처리 결과를 안내할 FE 화면. 성공·실패 모두 이 주소로 302한다.
    frontend-callback-url: ${FRONTEND_CALLBACK_URL:http://localhost:8080/auth/callback}
    # redirectTo는 사용자 입력이므로 허용 목록과 정확히 일치할 때만 통과시킨다.
    # 목록의 첫 항목이 redirectTo 미지정 시 기본 목적지가 된다.
    allowed-redirect-paths: ${OAUTH_ALLOWED_REDIRECT_PATHS:/onboarding/repositories,/repos,/admin,/}

cookie:
  # 로컬 http에서는 false. 운영은 COOKIE_SECURE=true로 주입한다.
  secure: ${COOKIE_SECURE:false}
